name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/widgets/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Install widget dependencies
        run: npm --prefix src/widgets ci

      - name: Typecheck
        run: npm run typecheck

      # NitroStack's application-boundary tests build widget components during
      # AppModule initialization, so the standalone export must exist first.
      - name: Standalone widget build
        run: npm run widget:build

      - name: Unit and integration tests
        run: npm test

      - name: Coverage gate
        run: npm run test:coverage

      - name: Server build
        run: npm run build

      # Live upstream tests are intentionally opt-in and are not run in CI by default.
